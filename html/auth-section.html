<div id="auth-screen">
  <div class="auth-card">

    <div class="auth-logo">👑</div>

    <h1>
      PIXEL <span>BATTLE</span>
    </h1>

    <div class="auth-tabs">
      <button
        id="show-login"
        class="auth-tab active"
        type="button"
      >
        Вход
      </button>

      <button
        id="show-register"
        class="auth-tab"
        type="button"
      >
        Регистрация
      </button>
    </div>


    <!-- ВХОД -->

    <form id="login-form">

      <input
        id="login-username"
        type="text"
        placeholder="Логин"
        autocomplete="username"
        required
      >

      <input
        id="login-password"
        type="password"
        placeholder="Пароль"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        ВОЙТИ
      </button>

      <div
        id="login-error"
        class="auth-message"
      ></div>

    </form>


    <!-- РЕГИСТРАЦИЯ -->

    <form
      id="register-form"
      class="hidden"
    >

      <input
        id="register-invite"
        type="text"
        placeholder="Код приглашения"
        autocomplete="off"
        required
      >

      <label id="referral-class-field" class="referral-class-field hidden">
        Выберите свой класс
        <select id="referral-class-select">
          <option value="">Загрузка классов...</option>
        </select>
      </label>

      <div id="register-username-fields">

      <input
        id="register-username"
        type="text"
        placeholder="Логин"
        autocomplete="username"
        minlength="3"
        maxlength="20"
        required
      >

      <small>
        Латинские буквы, цифры и _
      </small>

      </div>

      <input
        id="register-nickname"
        type="text"
        placeholder="Никнейм"
        maxlength="20"
        required
      >

      <div id="register-password-fields">

      <input
        id="register-password"
        type="password"
        placeholder="Пароль — минимум 8 символов"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <input
        id="register-password-repeat"
        type="password"
        placeholder="Повторите пароль"
        autocomplete="new-password"
        minlength="8"
        required
      >
        </div>

      <button type="submit">
        СОЗДАТЬ АККАУНТ
      </button>

      <div
        id="register-message"
        class="auth-message"
      ></div>

    </form>

    <div
  id="easy-register-success"
  class="easy-register-success hidden"
>

  <div class="easy-success-icon">
    🎉
  </div>

  <h2>Аккаунт создан!</h2>

  <p class="easy-success-nickname">
    Добро пожаловать,
    <strong id="easy-success-nickname">
      —
    </strong>
  </p>


  <div class="easy-credentials">

    <div class="easy-credential">

      <span>Логин</span>

      <div class="easy-credential-value">

        <strong id="easy-success-username">
          —
        </strong>

        <button
          id="copy-easy-username"
          type="button"
          title="Скопировать логин"
        >
          📋
        </button>

      </div>

    </div>


    <div class="easy-credential">

      <span>Пароль</span>

      <div class="easy-credential-value">

        <input
          id="easy-success-password"
          type="password"
          readonly
        >

        <button
          id="toggle-easy-password"
          type="button"
          title="Показать пароль"
        >
          👁
        </button>

        <button
          id="copy-easy-password"
          type="button"
          title="Скопировать пароль"
        >
          📋
        </button>

      </div>

    </div>

  </div>


  <p class="easy-save-warning">
    ⚠️ Сохрани логин и пароль.
    Они понадобятся для входа
    с другого устройства.
  </p>


  <button
    id="easy-start-button"
    type="button"
  >
    🎮 НАЧАТЬ ИГРАТЬ
  </button>

</div>

  </div>
</div>
