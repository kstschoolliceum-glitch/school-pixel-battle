<header class="header">
    <div class="brand-stack">
      <div class="logo">
        👑 <span>PIXEL <b>BATTLE</b></span>
      </div>
      <button id="pi-ticker-open" class="pi-ticker" type="button"
        aria-haspopup="dialog" aria-controls="pi-ticker-info-dialog" title="Посмотреть объявление">
        <span class="pi-ticker-icon" aria-hidden="true">📢</span>
        <span class="pi-ticker-live">LIVE</span>
        <strong id="pi-ticker-nickname">Сегодня свободно</strong>
        <span class="pi-ticker-viewport"><span id="pi-ticker-message" class="pi-ticker-message">Размести сообщение за 10 piCoin</span></span>
      </button>
    </div>

    <button id="music-open" class="music-open" type="button" aria-haspopup="dialog"
      aria-controls="music-dialog" aria-label="Настройки музыки: выключена" aria-pressed="false">♪</button>

    <div class="header-summary">
      <button id="pi-balance-button" class="pi-balance-button" type="button"
        aria-haspopup="dialog" aria-controls="pi-shop-dialog" title="Открыть магазин">
        <span aria-hidden="true">🪙</span>
        <strong id="pi-balance">0</strong>
        <span class="pi-balance-label">piCoin</span>
        <span class="pi-balance-shop">Магазин ›</span>
      </button>

      <div class="season">
        <span class="season-topline">
          <span id="season-info">
            Загрузка сезона...
          </span>

          <span
            id="online-users"
            class="online-users"
            title="Участников онлайн"
          >
            <span class="online-dot"></span>
            <span id="online-users-count">1</span>
            <span class="online-label">онлайн</span>
          </span>
        </span>

        <span id="season-countdown"></span>
      </div>
    </div>
  </header>


  <dialog id="music-dialog" class="music-dialog" aria-labelledby="music-dialog-title">
    <button id="music-close" type="button">Закрыть</button>
    <h2 id="music-dialog-title">♫ Музыка</h2>
    <p>Тема: <strong id="music-current-theme">Классическая</strong></p>
    <p>Композиция: <span id="music-current-track">Музыка выключена</span></p>
    <label><input id="music-enabled" type="checkbox"> Музыка включена</label>
    <label>Громкость <input id="music-volume" type="range" min="0" max="100" value="30">%</label>
    <p id="music-status" class="music-status" role="status"></p>
  </dialog>

  <dialog id="pi-ticker-info-dialog" class="pi-ticker-info-dialog" aria-labelledby="pi-ticker-info-title">
    <button id="pi-ticker-info-close" class="pi-ticker-info-close" type="button">Закрыть</button>
    <h2 id="pi-ticker-info-title">📢 Объявление</h2>
    <dl class="pi-ticker-info-details">
      <dt>Автор</dt><dd id="pi-ticker-info-author">—</dd>
      <dt>Сообщение</dt><dd id="pi-ticker-info-message">—</dd>
      <dt id="pi-ticker-info-date-label" hidden>День объявления</dt><dd id="pi-ticker-info-date" hidden></dd>
    </dl>
    <button id="pi-ticker-info-bid" type="button" aria-haspopup="dialog"
      aria-controls="pi-ticker-dialog">Разместить или перебить объявление</button>
  </dialog>

  <dialog id="pi-ticker-dialog" class="pi-ticker-dialog" aria-labelledby="pi-ticker-title">
    <button id="pi-ticker-close" class="pi-ticker-close" type="button" aria-label="Закрыть">×</button>
    <h2 id="pi-ticker-title">📢 Бегущая строка дня</h2>
    <p>Сообщение показывается всем, пока другой ученик не предложит больше piCoin.</p>
    <div class="pi-ticker-current"><strong id="pi-ticker-dialog-nickname">Сегодня место свободно</strong><span id="pi-ticker-dialog-message">Начни торги первым.</span></div>
    <label for="pi-ticker-input">Твоё сообщение · до 80 символов</label>
    <textarea id="pi-ticker-input" maxlength="80" rows="3" placeholder="Напиши сообщение для всей школы"></textarea>
    <label for="pi-ticker-bid-price">Твоя ставка · минимум <span id="pi-ticker-min-price">10</span> piCoin</label>
    <input id="pi-ticker-bid-price" type="number" min="10" step="1" value="10" inputmode="numeric">
    <button id="pi-ticker-bid" type="button">РАЗМЕСТИТЬ ЗА <span id="pi-ticker-price">10</span> 🪙</button>
    <span id="pi-ticker-status" aria-live="polite"></span>
  </dialog>
