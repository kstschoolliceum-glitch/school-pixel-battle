<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Pixel Battle</title>

  <meta name="theme-color" content="#10182b">
  <meta
    name="description"
    content="Школьная пиксельная битва классов"
  >

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="style.css?v=80">
</head>

<body>
  <div
  id="telegram-popup"
  class="telegram-popup hidden"
>

  <div class="telegram-popup-card">

    <div class="telegram-popup-icon">
      📢
    </div>

    <h2>
      Будь в курсе Pixel Battle
    </h2>

    <p>
      Новости, итоги недель и важные
      объявления публикуются в нашем
      Telegram-канале.
    </p>

    <a
      id="telegram-join-button"
      href="https://t.me/elttabxelip"
      target="_blank"
      rel="noopener noreferrer"
    >
      ✈️ ВСТУПИТЬ В КАНАЛ
    </a>

    <button
      id="telegram-later-button"
      type="button"
    >
      Не сейчас
    </button>

  </div>

</div>

<div
  id="push-permission-popup"
  class="telegram-popup hidden"
>

  <div class="telegram-popup-card">

    <div class="telegram-popup-icon">
      🔔
    </div>

    <h2>
      Не пропускай события
    </h2>

    <p id="push-permission-popup-text">
      Включи уведомления, чтобы узнать
      о начале нового сезона и последних
      часах перед его завершением.
    </p>

    <button
      id="push-permission-enable-button"
      type="button"
    >
      🔔 ВКЛЮЧИТЬ УВЕДОМЛЕНИЯ
    </button>

    <button
      id="push-permission-later-button"
      type="button"
    >
      Не сейчас
    </button>

  </div>

</div>

<div data-html-fragment="html/auth-section.html"></div>
    <div data-html-fragment="html/header-section.html"></div>


    <div data-html-fragment="html/game-section.html"></div>



<div data-html-fragment="html/dialogs.html"></div><nav class="mobile-nav" style="grid-template-columns:repeat(5,minmax(0,1fr))">

  <button
    id="mobile-map-button"
    class="selected"
    type="button"
  >
    🗺️
    <span>Карта</span>
  </button>

  <button
    id="mobile-ranking-button"
    type="button"
  >
    🏆
    <span>Рейтинг</span>
  </button>
<button
  id="mobile-chat-button"
  type="button"
>
  💬
  <span>Чат</span>
</button>
  <button
    id="mobile-minigames-button"
    type="button"
  >
    🎮
    <span>Задания</span>
  </button>
  <button
    id="mobile-profile-button"
    type="button"
  >
    👤
    <span>Профиль</span>
  </button>

</nav>

  <audio
    id="background-music"
    loop
    preload="none"
  >
    <source
      src="assets/music/1-Hour-Relax-%26-study-with-me-Lofi-Tunes-of-Capy.mp3?v=1"
      type="audio/mpeg"
    >
  </audio>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"
  ></script>
  <script src="https://cdn.jsdelivr.net/npm/gif.js.optimized@1.0.1/dist/gif.js"></script>
  <script src="js/loader.js?v=4"></script>

</body>
</html>
